name: Release
run-name: ${{ inputs.dry_run != false && github.event_name == 'workflow_dispatch' && 'Dry run' || 'Release' }} ${{ inputs.version || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate
        required: true
        default: '0.3.8'
        type: string
      dry_run:
        description: Build, sign, notarize and verify without publishing
        default: true
        type: boolean
permissions: {}
concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require tag pushes for live releases
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT" == workflow_dispatch && "$DRY_RUN" != true ]]; then
            echo 'Live releases require an authorized signed tag push' >&2
            exit 1
          fi
  release:
    needs: policy
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-swift-cli.yml@v1
    with:
      version: ${{ inputs.version || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      repository-type: openclaw
      require-signed-tag: true
      ci-check-events: '["push"]'
      binary-name: remindctl
      binary-identifier: com.steipete.remindctl
      macos-archive-name: remindctl-macos.zip
      checksum-filename: checksums.txt
      include-helper: false
      include-linux: false
      require-resource-bundles: false
      helper-name: ''
      helper-identifier: ''
      linux-archive-name: ''
      linux-build-script: ''
      macos-runner: macos-26
      verify-arm64-runner: macos-26
      minimum-macos-version: 14
      macos-build-script: scripts/build-release.sh
      prepare-script: ''
      generate-version-script: scripts/generate-version.sh
      entitlements-file: ''
      version-file: 'version.env'
      metadata-check-script: scripts/check-release-version.sh
      homebrew-tap: steipete/homebrew-tap
      homebrew-formula: remindctl
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
